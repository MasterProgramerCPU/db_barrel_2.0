<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DB Barrel 2.0 — Database schema introspection tool">
    <title>DB Barrel 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tahoma&family=Trebuchet+MS&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- XP-style title bar -->
    <header id="app-header">
        <div class="header-left">
            <div id="logo-home" class="logo-area">
                <img src="svg/barrel.svg" alt="DB Barrel" class="logo-icon">
                <h1 class="title-text">DB Barrel 2.0</h1>
            </div>
        </div>
        <div class="header-center">
            <span id="current-db-name" class="current-db-label" hidden></span>
        </div>
        <div class="header-right">
            <span id="db-count-badge" class="count-badge"></span>
            <button id="reload-btn" class="xp-btn reload-btn" title="Reload all databases">Reload</button>
        </div>
    </header>

    <!-- Screen 1: Database Galaxy -->
    <div id="galaxy-screen" class="screen">
        <div id="add-db-panel" class="xp-dialog add-db-panel">
            <div class="xp-dialog-titlebar">
                <span class="xp-dialog-title">Add Database</span>
                <div class="panel-title-actions">
                    <button id="toggle-add-db" class="xp-min-btn" type="button" aria-expanded="true">_</button>
                </div>
            </div>
            <div id="add-db-body" class="xp-dialog-body add-db-body">
                <form id="add-db-form" class="add-db-form">
                    <label class="form-row">
                        <span>Name</span>
                        <input type="text" id="db-name-input" name="name" required>
                    </label>
                    <label class="form-row">
                        <span>Driver</span>
                        <select id="db-driver-input" name="driver">
                            <option value="postgresql">PostgreSQL</option>
                            <option value="mysql">MySQL</option>
                            <option value="mariadb">MariaDB</option>
                            <option value="sqlite">SQLite</option>
                        </select>
                    </label>
                    <label class="form-row driver-network">
                        <span>Host</span>
                        <input type="text" id="db-host-input" name="host">
                    </label>
                    <label class="form-row driver-network">
                        <span>Port</span>
                        <input type="number" id="db-port-input" name="port" min="0" step="1">
                    </label>
                    <label class="form-row driver-network">
                        <span>Database</span>
                        <input type="text" id="db-database-input" name="database">
                    </label>
                    <label class="form-row driver-network">
                        <span>User</span>
                        <input type="text" id="db-user-input" name="user">
                    </label>
                    <label class="form-row driver-network">
                        <span>Password</span>
                        <input type="password" id="db-password-input" name="password">
                    </label>
                    <label class="form-row driver-network driver-postgres">
                        <span>SSL Mode</span>
                        <input type="text" id="db-sslmode-input" name="sslMode" value="disable">
                    </label>
                    <label class="form-row driver-network">
                        <span>Params</span>
                        <input type="text" id="db-params-input" name="params">
                    </label>
                    <label class="form-row driver-sqlite" hidden>
                        <span>Path</span>
                        <input type="text" id="db-path-input" name="path">
                    </label>
                    <div class="form-actions">
                        <button id="add-db-submit" class="xp-btn" type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
        <svg id="galaxy-svg"></svg>
    </div>

    <!-- Screen 2: Schema View -->
    <div id="schema-screen" class="screen" hidden>
        <div id="schema-toolbar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="schema-search" placeholder="Search tables & columns…" autocomplete="off">
                <span id="search-count" class="search-count" hidden></span>
                <button id="search-clear" class="search-clear" hidden>✕</button>
            </div>
        </div>
        <svg id="schema-svg"></svg>
    </div>

    <!-- Floating Detail Window (XP dialog style) -->
    <div id="detail-overlay" class="xp-dialog" hidden>
        <div class="xp-dialog-titlebar">
            <span id="detail-table-name" class="xp-dialog-title"></span>
            <button id="close-detail" class="xp-close-btn">✕</button>
        </div>
        <div id="detail-content" class="xp-dialog-body"></div>
    </div>

    <!-- Toast notification -->
    <div id="toast" class="toast" hidden></div>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
